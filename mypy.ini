[mypy]
python_version = 3.11
ignore_missing_imports = True
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
exclude = (?x)(
    ^alembic/
    | ^\.venv/
  )

# Scoped to the core modules - third
# party stubs (langgraph, sentence-transformers, apscheduler, langfuse) are
# incomplete/absent, so a repo-wide strict pass would mostly flag untyped
# vendor code rather than ours. Widen this list as modules get cleaned up.
[mypy-config]
disallow_untyped_defs = True

[mypy-database.*]
disallow_untyped_defs = True

[mypy-scoring.*]
disallow_untyped_defs = True

[mypy-extraction.*]
disallow_untyped_defs = True
